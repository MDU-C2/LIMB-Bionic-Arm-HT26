name: Software checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-setup.txt -r requirements-dev.txt
      - run: python scripts/check_project.py
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests
      - run: python scripts/check_package.py
