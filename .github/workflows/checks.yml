name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests

  tests:
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        id: environment
        with:
          environment-file: environment.yml
          init-shell: none
          cache-environment: true
      - name: Select project Python
        env:
          AURORA_CI_PREFIX: ${{ steps.environment.outputs.environment-path }}
        run: |
          $taskPython = Join-Path $env:AURORA_CI_PREFIX $(if ($IsWindows) { 'python.exe' } else { 'bin/python' })
          if (-not (Test-Path -LiteralPath $taskPython)) { throw "Project Python not found: $taskPython" }
          "AURORA_CI_PYTHON=$taskPython" >> $env:GITHUB_ENV
          if ($IsWindows) {
            $env:AURORA_CI_PREFIX >> $env:GITHUB_PATH
            (Join-Path $env:AURORA_CI_PREFIX 'Scripts') >> $env:GITHUB_PATH
            (Join-Path $env:AURORA_CI_PREFIX 'Library/bin') >> $env:GITHUB_PATH
          }
      - name: Install training dependencies and the local package
        run: |
          if ($IsWindows -or $IsLinux) {
            & $env:AURORA_CI_PYTHON -m pip install "torch>=2.2,<2.6" --index-url https://download.pytorch.org/whl/cpu
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:AURORA_CI_PYTHON -m pip install -r requirements-setup.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AURORA_CI_PYTHON -m pip install --no-deps -e .
      - name: Run offline tests
        run: '& $env:AURORA_CI_PYTHON scripts/check_project.py'
      - name: Check installed package resources
        run: '& $env:AURORA_CI_PYTHON scripts/check_package.py'
