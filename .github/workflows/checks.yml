name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src scripts tests
      - run: python -m ruff format --check src scripts tests

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          init-shell: none
          cache-environment: true
      - name: Install training dependencies and the local package
        shell: pwsh
        run: |
          if ($IsWindows -or $IsLinux) {
            micromamba run -n aurora python -m pip install "torch>=2.2,<2.6" --index-url https://download.pytorch.org/whl/cpu
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          micromamba run -n aurora python -m pip install -r requirements-setup.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          micromamba run -n aurora python -m pip install --no-deps -e .
      - name: Run offline tests
        run: micromamba run -n aurora python scripts/check_project.py
      - name: Check installed package resources
        run: micromamba run -n aurora python scripts/check_package.py
